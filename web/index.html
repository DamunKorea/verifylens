<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Try VerifyLens</title>
<meta name="description" content="Paste a requirement and the code an AI wrote. VerifyLens shows per requirement whether it is verified, different, or not yet verified. Runs in your browser, no LLM.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root {
  --bg: #f6f7f9; --surface: #ffffff; --surface-2: #f1f3f6; --text: #0f1b30; --muted: #5b6577; --border: #e2e6ed;
  --accent: #2f6fdb; --accent-soft: #e8f0fd; --code-bg: #fbfcfd;
  --ok: #1d7f52; --ok-soft: #e4f4ec; --bad: #c63b3b; --bad-soft: #fbe9e9; --unk: #8a6a12; --unk-soft: #f8f0d9;
  --shadow: 0 1px 2px rgba(15, 27, 48, .06), 0 4px 16px rgba(15, 27, 48, .05);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b1220; --surface: #121b2e; --surface-2: #18233a; --text: #e6eaf2; --muted: #9aa4b5; --border: #24314a;
    --accent: #6ea8ff; --accent-soft: #1a2a48; --code-bg: #0f1828;
    --ok: #4cc38a; --ok-soft: #133226; --bad: #ff7b7b; --bad-soft: #3a1c22; --unk: #e0b84f; --unk-soft: #33290f;
    --shadow: none;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
a { color: var(--accent); }
/* >= 를 ≥ 한 글자로 합쳐 보이면 판정 근거를 잘못 읽게 되므로 합자를 끈다 */
code, textarea.code, input.file, .codeview, .strip { font-family: ui-monospace, "Cascadia Code", Consolas, "D2Coding", monospace; font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 16px; }
header { border-bottom: 1px solid var(--border); background: var(--surface); }
header .wrap { display: flex; align-items: center; gap: 12px; min-height: 60px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; color: var(--text); text-decoration: none; }
.brand img { width: 28px; height: 28px; }
.spacer { flex: 1; }
.lang { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.lang button { border: 0; background: transparent; color: var(--muted); padding: 6px 10px; font: inherit; font-size: 13px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.hero { padding: 28px 0 8px; }
.hero h1 { margin: 0 0 6px; font-size: 26px; line-height: 1.25; letter-spacing: -0.01em; }
.hero p { margin: 0; color: var(--muted); max-width: 760px; }
.privacy { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 13px; color: var(--muted); }
.examples { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 18px 0 14px; }
.examples span { font-size: 13px; color: var(--muted); margin-right: 2px; }
.chip { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; padding-bottom: 28px; }
@media (max-width: 900px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); }
.panel > h2 { margin: 0; padding: 14px 16px 0; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.field { padding: 12px 16px 16px; border-bottom: 1px solid var(--border); }
.field:last-child { border-bottom: 0; }
.field label, .field .label { display: block; font-weight: 600; margin-bottom: 4px; }
.hint { font-size: 12.5px; color: var(--muted); margin: 0 0 8px; }
textarea, input[type="text"], select { width: 100%; border: 1px solid var(--border); border-radius: 8px; background: var(--code-bg); color: var(--text); font: inherit; padding: 9px 10px; }
textarea { resize: vertical; }
textarea.code { font-size: 13px; line-height: 1.5; min-height: 300px; tab-size: 2; white-space: pre; overflow: auto; }
textarea.reqs { min-height: 104px; }
input.file { font-family: ui-monospace, Consolas, monospace; font-size: 13px; margin-bottom: 8px; }
textarea:focus, input:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.tests { display: grid; gap: 8px; }
.test { display: grid; grid-template-columns: minmax(0, 1fr) 96px 32px; gap: 6px; }
.test select { padding: 8px 6px; }
.icon-btn { border: 1px solid var(--border); background: var(--surface); color: var(--muted); border-radius: 8px; cursor: pointer; font-size: 16px; line-height: 1; }
.add { margin-top: 8px; border: 1px dashed var(--border); background: transparent; color: var(--accent); border-radius: 8px; padding: 7px 10px; font: inherit; font-size: 13px; cursor: pointer; }
.result { padding: 14px 16px 16px; }
.headline { font-weight: 700; font-size: 17px; margin: 0 0 12px; }
.status { font-size: 13px; color: var(--muted); }
.cards { display: grid; gap: 10px; }
.card { border: 1px solid var(--border); border-left: 4px solid var(--unk); border-radius: 10px; padding: 12px 12px 12px 14px; background: var(--surface); cursor: pointer; text-align: left; font: inherit; color: inherit; width: 100%; }
.card.ok { border-left-color: var(--ok); }
.card.bad { border-left-color: var(--bad); }
.card .top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.badge { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--unk-soft); color: var(--unk); white-space: nowrap; }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.bad { background: var(--bad-soft); color: var(--bad); }
.rid { font-weight: 700; }
.rtext { font-weight: 600; }
.summary { margin: 6px 0 0; }
.meta { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
.todo { margin: 8px 0 0; padding: 8px 10px 8px 26px; background: var(--unk-soft); border-radius: 8px; font-size: 13px; }
.todo li + li { margin-top: 4px; }
.todo b { color: var(--unk); }
.strip { margin: 8px 0 0; padding: 8px 10px; background: var(--surface-2); border-radius: 8px; font-size: 12.5px; white-space: pre; overflow-x: auto; }
.codewrap { margin-top: 16px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.codewrap .cap { padding: 7px 12px; font-size: 12.5px; color: var(--muted); background: var(--surface-2); border-bottom: 1px solid var(--border); font-family: ui-monospace, Consolas, monospace; }
.codeview { margin: 0; padding: 8px 0; background: var(--code-bg); font-size: 12.5px; line-height: 1.6; overflow-x: auto; }
.ln { display: flex; min-width: max-content; padding-right: 16px; border-left: 3px solid transparent; }
.ln .no { width: 42px; flex: none; text-align: right; padding-right: 12px; color: var(--muted); user-select: none; }
.ln .tx { white-space: pre; }
.ln.hl-warn { background: var(--bad-soft); border-left-color: var(--bad); }
.ln.hl-ok { background: var(--ok-soft); border-left-color: var(--ok); }
.ln.hl-info { background: var(--unk-soft); border-left-color: var(--unk); }
.ln-note { position: sticky; left: 0; padding: 2px 12px 6px 45px; font-size: 12px; font-weight: 600; white-space: normal; max-width: 100%; }
.ln-note.warn { color: var(--bad); background: var(--bad-soft); } .ln-note.ok { color: var(--ok); background: var(--ok-soft); } .ln-note.info { color: var(--unk); background: var(--unk-soft); }
.ln.flash { outline: 2px solid var(--accent); outline-offset: -2px; }
.empty { color: var(--muted); font-size: 14px; }
.next { margin: 16px 0 0; padding: 12px 14px; background: var(--accent-soft); border-radius: 10px; font-size: 14px; }
.next b { display: block; margin-bottom: 4px; }
footer { border-top: 1px solid var(--border); color: var(--muted); font-size: 13px; padding: 18px 0 28px; }
footer ul { margin: 6px 0 0; padding-left: 18px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a class="brand" href="https://github.com/DamunKorea/verifylens"><img src="icon.svg" alt="">VerifyLens</a>
    <span class="spacer"></span>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="true">English</button>
      <button type="button" data-lang="ko" aria-pressed="false">한국어</button>
    </div>
  </div>
</header>
<main class="wrap">
  <section class="hero">
    <h1 data-t="title"></h1>
    <p data-t="lead"></p>
    <div class="privacy" data-t="privacy"></div>
  </section>
  <div class="examples" id="examples"><span data-t="examples"></span></div>
  <div class="grid">
    <section class="panel" aria-labelledby="in-h">
      <h2 id="in-h" data-t="input"></h2>
      <div class="field">
        <label for="reqs" data-t="reqLabel"></label>
        <p class="hint" data-t="reqHint"></p>
        <textarea id="reqs" class="reqs" spellcheck="false"></textarea>
      </div>
      <div class="field">
        <label for="code" data-t="codeLabel"></label>
        <p class="hint" data-t="codeHint"></p>
        <input id="file" class="file" type="text" aria-label="File name" spellcheck="false">
        <textarea id="code" class="code" spellcheck="false" wrap="off"></textarea>
      </div>
      <div class="field">
        <span class="label" data-t="testLabel"></span>
        <p class="hint" data-t="testHint"></p>
        <div class="tests" id="tests"></div>
        <button type="button" class="add" id="add-test" data-t="addTest"></button>
      </div>
    </section>
    <section class="panel" aria-labelledby="out-h">
      <h2 id="out-h" data-t="result"></h2>
      <div class="result" aria-live="polite">
        <p class="status" id="status"></p>
        <p class="headline" id="headline"></p>
        <div class="cards" id="cards"></div>
        <div class="codewrap" id="codewrap" hidden>
          <div class="cap" id="codecap"></div>
          <pre class="codeview" id="codeview"></pre>
        </div>
        <div class="next"><b data-t="nextTitle"></b><span data-t="nextBody"></span></div>
      </div>
    </section>
  </div>
</main>
<footer>
  <div class="wrap">
    <div data-t="limits"></div>
    <ul>
      <li data-t="limit1"></li>
      <li data-t="limit2"></li>
      <li data-t="limit3"></li>
    </ul>
  </div>
</footer>
<script type="module" src="app.js"></script>
</body>
</html>
