# `npx -y github:DamunKorea/verifylens …` runs dist/cli.mjs, the command line bundled from src/ by tools/build-cli.mjs.
# This checks that the bundle in the repository matches src/, and that npx installs it from GitHub and runs it.
name: CLI package

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'dist/**'
      - 'samples/**'
      - 'vscode/src/model.ts'
      - 'tools/build-cli.mjs'
      - 'package.json'
      - '.github/workflows/cli.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install esbuild
        run: npm ci --prefix vscode --no-audit --no-fund
      - name: dist/cli.mjs matches src
        run: node tools/build-cli.mjs --check
      # npm 10 (bundled with Node 22) fails on `github:owner/repo#<commit sha>` with
      # "GitFetcher requires an Arborist constructor to pack a tarball"; a branch or a tag works.
      # So this commit is installed from its tarball, and the README form from the branch.
      - name: Install this commit with npx and run the sample check
        working-directory: ${{ runner.temp }}
        run: |
          npx -y "https://codeload.github.com/${{ github.repository }}/tar.gz/${{ github.sha }}" check > check.txt
          tail -n 4 check.txt
          grep -q "R2" check.txt
      - name: Install the README way (npx github:owner/repo#branch)
        working-directory: ${{ runner.temp }}
        run: npx -y "github:${{ github.repository }}#${{ github.ref_name }}" help | head -n 4
