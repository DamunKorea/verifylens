# Builds the "try it in your browser" page from web/ and publishes it with GitHub Pages.
# The page runs the same engine as the extension, entirely in the browser.
name: Try page

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'src/**'
      - 'vscode/src/model.ts'
      - 'jetbrains/src/main/resources/META-INF/pluginIcon.svg'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install
        run: |
          npm ci
          npm ci --prefix vscode
      - name: Check the examples
        run: node --test web/check.test.ts
      - name: Build
        run: node web/build.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
